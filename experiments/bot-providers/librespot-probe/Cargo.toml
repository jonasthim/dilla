[package]
name = "dilla-librespot-probe"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
base64 = "0.22"
librespot = { version = "=0.8.0", default-features = false, features = ["native-tls"] }
nix = { version = "0.29", features = ["fs", "poll", "user"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "io-util", "signal"] }
url = "2"
rand = "0.8"
