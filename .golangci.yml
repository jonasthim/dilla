version: "2"

linters:
  default: standard        # errcheck, govet, ineffassign, staticcheck, unused — and nothing else
  enable:
    # security: gosec is NOT in the standard group and has to be named.
    - gosec
    # correctness, firing today
    - errorlint
    - noctx
    - usetesting
    # correctness, zero findings today, real targets in W2-W5
    - bodyclose
    - rowserrcheck
    - sqlclosecheck
    - asasalint
    - bidichk
    - copyloopvar
    - durationcheck
    - gocheckcompilerdirectives
    - makezero
    - misspell
    - nilerr
    - nilnesserr
    - nolintlint
    - predeclared
    - reassign
    - recvcheck
    - unconvert
    - wastedassign

  settings:
    errcheck:
      check-type-assertions: true
      exclude-functions:
        # CLI and diagnostic output: a failed write to a terminal, a pipe or a response has no
        # recovery path, and `_, _ = fmt.Fprintf(...)` at ~30 sites is noise, not safety.
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    govet:
      # NOT enable-all: it turns on `shadow` (23 findings, all the repository's own
      # `if err := f(); err != nil` idiom) and `fieldalignment` (12) — both of which upstream's own
      # vet suite omits as too noisy.
      enable:
        - nilness
        - unusedwrite
    gosec:
      excludes:
        - G104                      # duplicates errcheck exactly
    nolintlint:
      allow-unused: false
      require-explanation: true
      require-specific: true
    rowserrcheck:
      packages:
        - github.com/jackc/pgx/v5   # the default only knows database/sql
    staticcheck:
      checks:
        - all
    # No misspell.locale: US flags the repository's British prose, UK flags Go's own vocabulary,
    # and the neutral default flags neither.

  exclusions:
    generated: lax
    warn-unused: true
    paths:
      # npm dependencies may contain Go examples; they are not part of the Go module.
      - ^node_modules/
    rules:
      # wasm32 ABI: every pointer and length crossing the wazero boundary is a uint32 by
      # construction. Scoped to this package, NOT global — G115 must stay live in internal/cborx,
      # which parses untrusted envelope bytes.
      - path: ^internal/mlswasi/
        text: G115
        linters:
          - gosec
      # The two store adapters are the int64 (SQL INTEGER) <-> uint64 (protocol id, unix second,
      # counter) boundary: every column crosses it, ~190 sites. The rows READ back are values this
      # server wrote as non-negative, but not every value WRITTEN or QUERIED is: a client-supplied
      # cursor (`from`, a message seq) reaches an adapter as a uint64. Those are bounded ABOVE the
      # adapters, where G115 stays live (`api.queryFrom`/`queryCursor`, `ds.clampCursor`), and a
      # new client-controlled uint64 that reaches a store method must be bounded the same way:
      # this exclusion will not flag it. Scoped to the adapters, NOT global. A deviation from the
      # brief's file, kept pending a controller ruling.
      - path: ^internal/store/(sqlite|postgres)/
        text: G115
        linters:
          - gosec
      - path: _test\.go$
        linters:
          - errcheck
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:               # a LIST in v2, not the v1 string
        - github.com/jonasthim/dilla

issues:
  # The defaults (50 / 3 / true) silently drop real findings.
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false
