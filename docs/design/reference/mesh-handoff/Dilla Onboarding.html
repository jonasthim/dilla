<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dilla · Onboarding</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="chat.css">
<link rel="stylesheet" href="onboarding.css">

<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #070809; overflow: hidden; }
  body { font-family: 'JetBrains Mono', ui-monospace, monospace; color: #e8ece8; }
  #root { width: 100vw; height: 100vh; }
</style>
</head>
<body data-screen-label="01 Onboarding">

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="themes.js"></script>

<script type="text/babel" src="onboarding.jsx"></script>

<script type="text/babel">
  function App() {
    const Onb = window.Onboarding;
    const meshVars = window.THEMES.themeVars(window.THEMES.mesh);
    return (
      <div className="chat" data-style="mesh" style={{ ...meshVars, display: 'block', position: 'relative', height: '100%' }}>
        <Onb />
      </div>
    );
  }
  function mount() {
    if (window.Onboarding && window.THEMES) {
      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    } else {
      setTimeout(mount, 30);
    }
  }
  mount();
</script>

</body>
</html>
