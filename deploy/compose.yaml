# Set livekit.mode = 'sidecar' in dilla.toml. Keep netns running while replacing
# dillad and media independently; it owns the published ports and loopback link.
# Use the private bridge network: Docker sets net.ipv4.ip_unprivileged_port_start
# there so UID 65532 can bind 443. Host networking needs that sysctl set manually.
services:
  netns:
    image: ghcr.io/jonasthim/dilla/dillad:latest
    command: ["netns"]
    restart: unless-stopped
    ports:
      - "443:443/tcp"
      - "7882:7882/udp"

  media:
    image: ghcr.io/jonasthim/dilla/dillad:latest
    command: ["media", "--config=/etc/dilla/dilla.toml"]
    restart: unless-stopped
    network_mode: "service:netns"
    depends_on:
      - netns
    volumes:
      - ./data:/var/lib/dilla
      - ./dilla.toml:/etc/dilla/dilla.toml:ro
    stop_grace_period: 25s

  dillad:
    image: ghcr.io/jonasthim/dilla/dillad:latest
    command: ["serve", "--config=/etc/dilla/dilla.toml"]
    restart: unless-stopped
    network_mode: "service:netns"
    depends_on:
      - netns
      - media
    volumes:
      # The data directory must already be owned by 65532:65532 on the host.
      - ./data:/var/lib/dilla
      - ./dilla.toml:/etc/dilla/dilla.toml:ro
    healthcheck:
      test: ["CMD", "/usr/local/bin/dillad", "doctor", "--config=/etc/dilla/dilla.toml", "--quiet"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    stop_grace_period: 45s
