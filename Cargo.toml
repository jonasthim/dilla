[workspace]
resolver = "3"
members = [
    "core/dilla-core",
    "core/dilla-core-wasm",
    "core/dilla-core-wasi",
    "testkit",
]
default-members = ["core/dilla-core", "testkit"]
# Third-party source carried with a patch (core/vendor/README.md): never a member, so fmt, clippy and
# the workspace lints leave the upstream code as it was published.
exclude = ["core/vendor"]

[workspace.package]
edition = "2024"
rust-version = "1.98"
repository = "https://github.com/jonasthim/dilla"

[workspace.lints.rust]
unsafe_code = "warn"          # dilla-core forbids it outright; the wasi crate opts back in

[profile.release]
lto = "thin"
codegen-units = 1

# C16 / web-1 ruling 23: the browser core. wasm-pack selects it with --profile wasm-release.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
strip = true

# opfs-report: sqlite-wasm-vfs 0.2.0 with one patched answer, so the journal of an interrupted write
# is played back on the next open. Remove when the browser store moves to sqlite-wasm-vfs >= 0.3.0.
[patch.crates-io]
sqlite-wasm-vfs = { path = "core/vendor/sqlite-wasm-vfs" }
