[package]
name = "dilla-spotify-helper"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
librespot = { version = "=0.8.0", default-features = false, features = ["rustls-tls-native-roots"] }
nix = { version = "0.29", default-features = false, features = ["poll", "fs"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "signal"] }

[lints.rust]
unsafe_code = "forbid"
