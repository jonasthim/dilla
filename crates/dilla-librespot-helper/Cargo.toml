[package]
name = "dilla-librespot-helper"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
librespot = { version = "=0.8.0", default-features = false, features = ["native-tls"] }
nix = { version = "0.29", features = ["fs", "poll"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }

[workspace]
