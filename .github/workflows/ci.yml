name: ci
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
jobs:
  # Decides which parts of the tree the change touches (scripts/ci-areas.mjs holds the path table and its tests) and
  # writes one output per area: go, core, web, e2e, text (the profile-text tables), and code for anything but docs. A pull request whose changed files
  # all sit under docs/ or are *.md is docs-only: it runs this job and `docs`, and every other job is skipped (a
  # skipped job counts as passed for a required check). A push to main, and any diff that cannot be computed, turn
  # every area on. Every job below `docs` carries `needs: changes` and an `if:` on the outputs it depends on.
  changes:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.areas.outputs.go }}
      core: ${{ steps.areas.outputs.core }}
      web: ${{ steps.areas.outputs.web }}
      e2e: ${{ steps.areas.outputs.e2e }}
      text: ${{ steps.areas.outputs.text }}
      code: ${{ steps.areas.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: areas
        run: node scripts/ci-areas.mjs
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
  # The cheap docs gates, their unit tests and the real checks against the real files: they run for every change,
  # docs-only included.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:docs-check
      - run: npm run test:brief-check
      - run: npm run test:copy-check
      - run: npm run check:docs
      - run: npm run check:brief
      - run: npm run check:copy
      # The workflow checker against the real tree; it reads the Go tests for the race and Postgres rules, so it
      # must run whatever the change was.
      - run: npm run check:ci
  # Heavy node gates. Any code change runs the script gates; `npm test` and the vectors check need the web or core areas.
  node:
    needs: [changes]
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:css-check
      - run: npm run check:css
      - run: npm run test:ci-check
      - run: npm run test:wasm-size-check
      - run: npm run test:manifest-writer
      - run: npm run test:install
      - if: needs.changes.outputs.web != 'false'
        run: npm test
      - name: vectors are up to date
        if: needs.changes.outputs.web != 'false'
        run: |
          [ ! -d packages ] || npm run vectors --workspaces --if-present
          git diff --exit-code -- protocol/vectors
          test -z "$(git status --porcelain -- protocol/vectors)"
      # The Unicode inputs are cached under a key of the generator file, which holds their pinned checksums: they are
      # downloaded once, and only when the generator, the tables or the rule change (the `text` area).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: needs.changes.outputs.text != 'false'
        with:
          path: ${{ runner.temp }}/ucd
          key: ucd-${{ hashFiles('scripts/gen-profile-text-tables.mjs') }}
      - name: profile-text tables are current
        if: needs.changes.outputs.text != 'false'
        run: node scripts/gen-profile-text-tables.mjs --download --check "$RUNNER_TEMP/ucd"
  ui:
    needs: [changes]
    if: needs.changes.outputs.web != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build -w packages/design-tokens
      - run: git diff --exit-code -- packages/design-tokens/dist
      - run: npm test -w packages/design-tokens
      - run: npm test -w packages/ui
      - run: npm run typecheck -w packages/design-tokens
      - run: npm run typecheck -w packages/ui
      - run: npx playwright install --with-deps chromium
      - run: npm run build-storybook -w packages/ui
      - name: axe on every story
        run: |
          npx concurrently -k -s first -n SB,TEST \
            "npx http-server packages/ui/storybook-static --port 6006 --silent" \
            "npx wait-on tcp:127.0.0.1:6006 && npm run test:storybook -w packages/ui -- --url http://127.0.0.1:6006"
      # F16 (web-1, web-2a, web-2b): every story of the components and of the composed onboarding, sign-in, settings,
      # shell and conversation screens (titles Form/, Ceremony/, Shell/, Conversation/, Settings/, Screens/,
      # Primitives/ChannelRow; web-2b's toolbar, reactions, editor, reply chip, mention list, pins, tray, cards,
      # lightbox and Screens/Conversation among them) in mesh, light and high-contrast, for the founder's review:
      # three PNGs per story. The script fails when a prefix matches no story; the last three prefixes match only
      # web-2b stories (Conversation/MessageToolbar, Conversation/AttachmentCard, Screens/Conversation).
      - name: Screenshots of the web-1, web-2a and web-2b components and screens in the three themes
        run: node packages/ui/scripts/shoot-stories.mjs 6016 target/ui-screens/web-2b form- ceremony- shell- conversation- settings- screens- primitives-channelrow-- conversation-messagetoolbar-- conversation-attachmentcard-- screens-conversation--
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ui-screens
          path: target/ui-screens/web-2b
          if-no-files-found: error
      # L-CI-22 (web-2c): every story of the seven web-2c families (trust compare and alert, search palette, typing,
      # diagnostics, tab hand-over and Screens/TrustAndPolish) in the three themes, at 1280×800 and at an actual
      # 360×740 browser viewport. Each prefix matches only web-2c stories, so a missing or renamed story fails here.
      - run: node packages/ui/scripts/shoot-stories.mjs 6027 target/ui-screens/web-2c/desktop trust-safetycompare-- trust-trustalert-- search-searchpalette-- status-typingindicator-- settings-diagnosticspanel-- shell-tabhand-over-- screens-trustandpolish--
      - run: node packages/ui/scripts/shoot-stories.mjs 6027 target/ui-screens/web-2c/phone trust-safetycompare-- trust-trustalert-- search-searchpalette-- status-typingindicator-- settings-diagnosticspanel-- shell-tabhand-over-- screens-trustandpolish-- --viewport=360x740
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ui-screens-web-2c
          path: |
            target/ui-screens/web-2c/desktop/**
            target/ui-screens/web-2c/phone/**
          if-no-files-found: error
      # web-3 task 11: every story of the voice, ring and media-player families (Voice/, Media/MediaPlayer and
      # Screens/Voice) in the three themes, at 1280×800 and at an actual 360×740 browser viewport, uploaded as one
      # artifact from target/ui-screens/web-3. Each prefix matches only web-3 stories, so a missing family fails here.
      - run: node packages/ui/scripts/shoot-stories.mjs 6038 target/ui-screens/web-3/desktop voice- media-mediaplayer-- screens-voice--
      - run: node packages/ui/scripts/shoot-stories.mjs 6038 target/ui-screens/web-3/phone voice- media-mediaplayer-- screens-voice-- --viewport=360x740
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ui-screens-web-3
          path: target/ui-screens/web-3/**
          if-no-files-found: error
  rust-wasm-node:
    needs: [changes]
    if: needs.changes.outputs.web != 'false'
    runs-on: ubuntu-24.04
    # The wasm C build (sqlite-wasm-rs compiles SQLite3MC through cc) uses clang 23, the dev box's major:
    # the runner's own clang emits about 25 KB more wasm, so the D5 budget would not mean the same bytes here.
    env:
      CC_wasm32_unknown_unknown: /usr/bin/clang-23
      AR_wasm32_unknown_unknown: /usr/bin/llvm-ar-23
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: clang 23 for the wasm C build
        run: |
          test "$(lsb_release -cs)" = noble
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key -o "$RUNNER_TEMP/llvm-snapshot.asc"
          gpg --dearmor -o "$RUNNER_TEMP/apt-llvm.gpg" "$RUNNER_TEMP/llvm-snapshot.asc"
          primaries=$(gpg --show-keys --with-colons "$RUNNER_TEMP/apt-llvm.gpg" | awk -F: '$1 == "pub" { want = 1; next } $1 == "fpr" && want { print $10; want = 0 }')
          test "$primaries" = 6084F3CF814B57C1CF12EFD515CF4D18AF4F7421
          sudo install -m 0644 "$RUNNER_TEMP/apt-llvm.gpg" /usr/share/keyrings/apt-llvm.gpg
          cmp "$RUNNER_TEMP/apt-llvm.gpg" /usr/share/keyrings/apt-llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/apt-llvm.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-23 main" | sudo tee /etc/apt/sources.list.d/apt-llvm-23.list
          sudo apt-get update
          apt-cache policy clang-23 llvm-23
          v='1:23.1.4~++20261020011024+7a941dfb2877-1~exp1~20261020131035.87'
          sudo apt-get install -y --no-install-recommends "clang-23=$v" "llvm-23=$v" "libllvm23=$v" "libclang-cpp23=$v" "libclang1-23=$v" "libclang-common-23-dev=$v" "llvm-23-linker-tools=$v" "llvm-23-runtime=$v"
          for p in clang-23 llvm-23 libllvm23 libclang-cpp23 libclang1-23 libclang-common-23-dev llvm-23-linker-tools llvm-23-runtime; do test "$(dpkg-query -W -f='${Version}' "$p")" = "$v"; done
          /usr/bin/clang-23 --version
          /usr/bin/llvm-ar-23 --version
      - run: rustup show active-toolchain
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: bash scripts/install-ci-tool.sh wasm-bindgen
      - run: bash scripts/install-ci-tool.sh wasm-pack
      - name: wasm-bindgen-cli must equal the Cargo.lock crate version
        run: |
          want=$(cargo metadata --format-version 1 --locked | jq -r '.packages[] | select(.name=="wasm-bindgen") | .version')
          have=$(wasm-bindgen --version | awk '{print $2}')
          test "$want" = "$have" || { echo "wasm-bindgen-cli $have != crate $want"; exit 1; }
      - run: cargo test -p dilla-core --target wasm32-unknown-unknown --locked --features vectors
      - run: cargo test -p dilla-core-wasm --target wasm32-unknown-unknown --locked --features vectors
      # Ruling 40: native clippy never compiles the wasm-only modules (store.rs, probe.rs, facade.rs).
      - run: cargo clippy -p dilla-core-wasm --target wasm32-unknown-unknown --lib --locked -- -D warnings
      - run: wasm-pack build core/dilla-core-wasm --target web --profile wasm-release --mode no-install --out-dir ../../packages/media/wasm
      - run: wasm-pack build core/dilla-core-wasm --target web --profile wasm-release --mode no-install --out-dir ../../packages/core-wasm/pkg
      - run: node scripts/check-wasm-size.mjs packages/core-wasm/pkg/dilla_core_wasm_bg.wasm
      - run: npm ci
      - run: npm run typecheck -w @dilla/media
      - run: npm run typecheck -w @dilla/core-wasm
      - run: npm run test:wasm -w @dilla/media
      - run: npm run check:schema -w @dilla/media

  rust-native:
    needs: [changes]
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: rustup show active-toolchain
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      # The lint and test steps need the core area; the job itself runs for any code, because go-harness and the
      # browser suites download the testkit binary built below.
      - if: needs.changes.outputs.core != 'false'
        run: cargo fmt --all --check
      - if: needs.changes.outputs.core != 'false'
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - if: needs.changes.outputs.core != 'false'
        run: cargo test --workspace --all-features --locked
      - run: cargo build -p dilla-testkit --release --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dilla-testkit
          path: target/release/dilla-testkit
          if-no-files-found: error

  rust-wasi:
    needs: [changes]
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: rustup show active-toolchain
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - run: cargo build -p dilla-core-wasi --target wasm32-wasip1 --release --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dilla-core-wasi
          path: target/wasm32-wasip1/release/dilla_core_wasi.wasm
          if-no-files-found: error

  vectors:
    needs: [changes]
    if: needs.changes.outputs.core != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run vectors
      - run: git diff --exit-code -- protocol/vectors
      - run: test -z "$(git status --porcelain -- protocol/vectors)"
      - run: rustup show active-toolchain
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - run: cargo run -p dilla-testkit --bin dilla-testkit --locked -- vectors

  browser-spike:
    needs: [changes]
    if: needs.changes.outputs.e2e != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The wasm C build (sqlite-wasm-rs compiles SQLite3MC through cc) uses clang 23, the dev box's major:
    # the runner's own clang emits about 25 KB more wasm, so the D5 budget would not mean the same bytes here.
    env:
      CC_wasm32_unknown_unknown: /usr/bin/clang-23
      AR_wasm32_unknown_unknown: /usr/bin/llvm-ar-23
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: clang 23 for the wasm C build
        run: |
          test "$(lsb_release -cs)" = noble
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key -o "$RUNNER_TEMP/llvm-snapshot.asc"
          gpg --dearmor -o "$RUNNER_TEMP/apt-llvm.gpg" "$RUNNER_TEMP/llvm-snapshot.asc"
          primaries=$(gpg --show-keys --with-colons "$RUNNER_TEMP/apt-llvm.gpg" | awk -F: '$1 == "pub" { want = 1; next } $1 == "fpr" && want { print $10; want = 0 }')
          test "$primaries" = 6084F3CF814B57C1CF12EFD515CF4D18AF4F7421
          sudo install -m 0644 "$RUNNER_TEMP/apt-llvm.gpg" /usr/share/keyrings/apt-llvm.gpg
          cmp "$RUNNER_TEMP/apt-llvm.gpg" /usr/share/keyrings/apt-llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/apt-llvm.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-23 main" | sudo tee /etc/apt/sources.list.d/apt-llvm-23.list
          sudo apt-get update
          apt-cache policy clang-23 llvm-23
          v='1:23.1.4~++20261020011024+7a941dfb2877-1~exp1~20261020131035.87'
          sudo apt-get install -y --no-install-recommends "clang-23=$v" "llvm-23=$v" "libllvm23=$v" "libclang-cpp23=$v" "libclang1-23=$v" "libclang-common-23-dev=$v" "llvm-23-linker-tools=$v" "llvm-23-runtime=$v"
          for p in clang-23 llvm-23 libllvm23 libclang-cpp23 libclang1-23 libclang-common-23-dev llvm-23-linker-tools llvm-23-runtime; do test "$(dpkg-query -W -f='${Version}' "$p")" = "$v"; done
          /usr/bin/clang-23 --version
          /usr/bin/llvm-ar-23 --version
      - run: rustup show active-toolchain
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: bash scripts/install-ci-tool.sh wasm-bindgen
      - run: bash scripts/install-ci-tool.sh wasm-pack
      - run: wasm-pack build core/dilla-core-wasm --target web --profile wasm-release --mode no-install --out-dir spike/pkg
      - run: npm ci
      # Deviation A2-6: the persistence matrix asserts Firefox private-browsing and WebKit
      # ephemeral behaviour, so those engines must be installed too.
      - run: npx playwright install --with-deps chromium firefox webkit
      # Only the matrix script: it already runs the chromium project, so adding `test:e2e` here would
      # execute the 10-hand-over test twice per run and rewrite opfs-leader-metrics.json for nothing.
      - run: npm run test:e2e:matrix -w @dilla/e2e

  browser-media:
    needs: [changes, rust-native, rust-wasi]
    if: needs.changes.outputs.e2e != 'false'
    runs-on: ubuntu-24.04
    # SP-27's cold container run was unavailable; the controller retains the 25-minute budget.
    timeout-minutes: 25
    # The wasm C build (sqlite-wasm-rs compiles SQLite3MC through cc) uses clang 23, the dev box's major:
    # the runner's own clang emits about 25 KB more wasm, so the D5 budget would not mean the same bytes here.
    env:
      CC_wasm32_unknown_unknown: /usr/bin/clang-23
      AR_wasm32_unknown_unknown: /usr/bin/llvm-ar-23
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: clang 23 for the wasm C build
        run: |
          test "$(lsb_release -cs)" = noble
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key -o "$RUNNER_TEMP/llvm-snapshot.asc"
          gpg --dearmor -o "$RUNNER_TEMP/apt-llvm.gpg" "$RUNNER_TEMP/llvm-snapshot.asc"
          primaries=$(gpg --show-keys --with-colons "$RUNNER_TEMP/apt-llvm.gpg" | awk -F: '$1 == "pub" { want = 1; next } $1 == "fpr" && want { print $10; want = 0 }')
          test "$primaries" = 6084F3CF814B57C1CF12EFD515CF4D18AF4F7421
          sudo install -m 0644 "$RUNNER_TEMP/apt-llvm.gpg" /usr/share/keyrings/apt-llvm.gpg
          cmp "$RUNNER_TEMP/apt-llvm.gpg" /usr/share/keyrings/apt-llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/apt-llvm.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-23 main" | sudo tee /etc/apt/sources.list.d/apt-llvm-23.list
          sudo apt-get update
          apt-cache policy clang-23 llvm-23
          v='1:23.1.4~++20261020011024+7a941dfb2877-1~exp1~20261020131035.87'
          sudo apt-get install -y --no-install-recommends "clang-23=$v" "llvm-23=$v" "libllvm23=$v" "libclang-cpp23=$v" "libclang1-23=$v" "libclang-common-23-dev=$v" "llvm-23-linker-tools=$v" "llvm-23-runtime=$v"
          for p in clang-23 llvm-23 libllvm23 libclang-cpp23 libclang1-23 libclang-common-23-dev llvm-23-linker-tools llvm-23-runtime; do test "$(dpkg-query -W -f='${Version}' "$p")" = "$v"; done
          /usr/bin/clang-23 --version
          /usr/bin/llvm-ar-23 --version
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: rustup show active-toolchain
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: bash scripts/install-ci-tool.sh wasm-bindgen
      - run: bash scripts/install-ci-tool.sh wasm-pack
      - name: Fetch the wasm32-wasip1 core built by the rust-wasi job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dilla-core-wasi
          path: internal/mlswasi/testdata
      - name: Fetch the testkit binary built by the rust-native job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dilla-testkit
          path: artifacts
      - run: chmod +x artifacts/dilla-testkit
      - run: wasm-pack build core/dilla-core-wasm --target web --profile wasm-release --mode no-install --out-dir ../../packages/media/wasm
      - run: go build -o target/dilla-mediabot ./cmd/dilla-mediabot
      - run: npm ci
      - run: node packages/media/scripts/extract-rnnoise-wasm.mjs
      - run: npx playwright install --with-deps chromium firefox
      - run: sh scripts/ci-audio-server.sh
      - run: npm run test:e2e:media -w @dilla/e2e
        env:
          DILLA_TESTKIT: ${{ github.workspace }}/artifacts/dilla-testkit
      - name: AV1 offered through the real SFU fails closed
        run: npx playwright test --config e2e/playwright.media.config.ts --project=chromium-media unsupported-sfu-codec.spec.ts
        env:
          DILLA_MEDIA_SFU_AV1: '1'
          DILLA_TESTKIT: ${{ github.workspace }}/artifacts/dilla-testkit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: browser-media-results
          path: e2e/test-results
          if-no-files-found: error

  web-build:
    needs: [changes]
    if: needs.changes.outputs.e2e != 'false'
    runs-on: ubuntu-24.04
    # C9: the web client is built once here and handed to chromium-web, firefox-web, webkit-web, and go-release, so every
    # consumer tests or ships the same bytes. The webdist test is web.New's manifest check over
    # packages/web/dist, where the build left it: nothing is copied into internal/web/dist (ruling 38).
    timeout-minutes: 15
    # The wasm C build (sqlite-wasm-rs compiles SQLite3MC through cc) uses clang 23, the dev box's major:
    # the runner's own clang emits about 25 KB more wasm, so the D5 budget would not mean the same bytes here.
    env:
      CC_wasm32_unknown_unknown: /usr/bin/clang-23
      AR_wasm32_unknown_unknown: /usr/bin/llvm-ar-23
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: clang 23 for the wasm C build
        run: |
          test "$(lsb_release -cs)" = noble
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key -o "$RUNNER_TEMP/llvm-snapshot.asc"
          gpg --dearmor -o "$RUNNER_TEMP/apt-llvm.gpg" "$RUNNER_TEMP/llvm-snapshot.asc"
          primaries=$(gpg --show-keys --with-colons "$RUNNER_TEMP/apt-llvm.gpg" | awk -F: '$1 == "pub" { want = 1; next } $1 == "fpr" && want { print $10; want = 0 }')
          test "$primaries" = 6084F3CF814B57C1CF12EFD515CF4D18AF4F7421
          sudo install -m 0644 "$RUNNER_TEMP/apt-llvm.gpg" /usr/share/keyrings/apt-llvm.gpg
          cmp "$RUNNER_TEMP/apt-llvm.gpg" /usr/share/keyrings/apt-llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/apt-llvm.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-23 main" | sudo tee /etc/apt/sources.list.d/apt-llvm-23.list
          sudo apt-get update
          apt-cache policy clang-23 llvm-23
          v='1:23.1.4~++20261020011024+7a941dfb2877-1~exp1~20261020131035.87'
          sudo apt-get install -y --no-install-recommends "clang-23=$v" "llvm-23=$v" "libllvm23=$v" "libclang-cpp23=$v" "libclang1-23=$v" "libclang-common-23-dev=$v" "llvm-23-linker-tools=$v" "llvm-23-runtime=$v"
          for p in clang-23 llvm-23 libllvm23 libclang-cpp23 libclang1-23 libclang-common-23-dev llvm-23-linker-tools llvm-23-runtime; do test "$(dpkg-query -W -f='${Version}' "$p")" = "$v"; done
          /usr/bin/clang-23 --version
          /usr/bin/llvm-ar-23 --version
      - run: rustup show active-toolchain
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: bash scripts/install-ci-tool.sh wasm-bindgen
      - run: bash scripts/install-ci-tool.sh wasm-pack
      - run: wasm-pack build core/dilla-core-wasm --target web --profile wasm-release --mode no-install --out-dir ../../packages/core-wasm/pkg
      - run: node scripts/check-wasm-size.mjs packages/core-wasm/pkg/dilla_core_wasm_bg.wasm
      - run: npm ci
      - run: npm run typecheck -w @dilla/core-wasm
      - run: npm run typecheck -w @dilla/client-core
      - run: npm run typecheck -w @dilla/web
      - run: npm run typecheck:e2e
      - run: npm run build -w @dilla/web
      - run: npm run test:noise-release
      # The dist guard fails (never skips) on any data: URL in the built CSS or JS; it needs the build above.
      - run: npm run -w @dilla/web test:dist
      - run: npm run build:harness -w @dilla/client-core
      - run: go test -tags webdist ./internal/web/...
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dilla-web-dist
          path: packages/web/dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dilla-core-harness
          path: packages/client-core/harness-dist/
          if-no-files-found: error

  chromium-web:
    needs: [changes, rust-native, rust-wasi, web-build]
    if: needs.changes.outputs.e2e != 'false'
    runs-on: ubuntu-latest
    # C18: the core-worker suite and the web suite in Chromium, against the test host serving the build same-origin, with the native testkit peer.
    # The wasm arrives inside the two builds; no Rust toolchain here.
    # Budget (L-CI-21, ruling of 2026-10-13: one job per Playwright project, each on its own share):
    # max(30, ceil(5 x (0.25 + 3.4 + 1.9)) + 10) = 38, from web-2c task 10's local wall times halved per engine (core-worker
    # suite 0.5 min, Chromium+Firefox web suite 6.8 min; re-measured 2026-10-13 in fix wave C2) and web-3 task 10's
    # Chromium voice suite (109 s locally, 2026-10-14).
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Fetch the wasm32-wasip1 core built by the rust-wasi job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dilla-core-wasi
          path: internal/mlswasi/testdata
      - name: Fetch the testkit binary built by the rust-native job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dilla-testkit
          path: artifacts
      - run: chmod +x artifacts/dilla-testkit
      - name: Fetch the web client built by the web-build job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dilla-web-dist
          path: packages/web/dist
      - name: Fetch the core-worker harness built by the web-build job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dilla-core-harness
          path: packages/client-core/harness-dist
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:core:chromium -w @dilla/e2e
        env:
          DILLA_TESTKIT: ${{ github.workspace }}/artifacts/dilla-testkit
      - run: npm run test:e2e:web:chromium -w @dilla/e2e
        env:
          DILLA_TESTKIT: ${{ github.workspace }}/artifacts/dilla-testkit
      # web-3 task 10: VOICE-E2E, two browsers through the test host's in-process LiveKit (its globalSetup builds the host).
      - run: npm run test:e2e:voice:chromium -w @dilla/e2e
        env:
          DILLA_TESTKIT: ${{ github.workspace }}/artifacts/dilla-testkit
      # upload-artifact v4+ refuses a second artifact of the same name in one run: one name per engine.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: browser-web-results-chromium
          path: e2e/test-results
          if-no-files-found: error

  firefox-web:
    needs: [changes, rust-native, rust-wasi, web-build]
    if: needs.changes.outputs.e2e != 'false'
    runs-on: ubuntu-latest
    # C18: the core-worker suite and the web suite in Firefox, against the test host serving the build same-origin, with the native testkit peer.
    # The wasm arrives inside the two builds; no Rust toolchain here.
    # Budget (L-CI-21, ruling of 2026-10-13: one job per Playwright project, each on its own share):
    # max(30, ceil(5 x (0.25 + 3.4 + 1.8)) + 10) = 38, from web-2c task 10's local wall times halved per engine (core-worker
    # suite 0.5 min, Chromium+Firefox web suite 6.8 min; re-measured 2026-10-13 in fix wave C2) and web-3 task 10's
    # Firefox voice suite (104 s locally, 2026-10-14).
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Fetch the wasm32-wasip1 core built by the rust-wasi job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dilla-core-wasi
          path: internal/mlswasi/testdata
      - name: Fetch the testkit binary built by the rust-native job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dilla-testkit
          path: artifacts
      - run: chmod +x artifacts/dilla-testkit
      - name: Fetch the web client built by the web-build job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dilla-web-dist
          path: packages/web/dist
      - name: Fetch the core-worker harness built by the web-build job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dilla-core-harness
          path: packages/client-core/harness-dist
      - run: npm ci
      - run: npx playwright install --with-deps firefox
      - run: npm run test:e2e:core:firefox -w @dilla/e2e
        env:
          DILLA_TESTKIT: ${{ github.workspace }}/artifacts/dilla-testkit
      # web-3 task 10: VOICE-E2E. Headless Firefox needs an audio server, or every AudioContext stays suspended.
      # Web3.9 CI2: before the web suite too, whose afk and layout specs place calls (a suspended context reads
      # no level, so the fake microphone's tone counts as speech and an idle desktop is never moved).
      - run: sh scripts/ci-audio-server.sh
      - run: npm run test:e2e:web:firefox -w @dilla/e2e
        env:
          DILLA_TESTKIT: ${{ github.workspace }}/artifacts/dilla-testkit
      - run: npm run test:e2e:voice:firefox -w @dilla/e2e
        env:
          DILLA_TESTKIT: ${{ github.workspace }}/artifacts/dilla-testkit
      # upload-artifact v4+ refuses a second artifact of the same name in one run: one name per engine.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: browser-web-results-firefox
          path: e2e/test-results
          if-no-files-found: error

  webkit-web:
    needs: [changes, rust-native, rust-wasi, web-build]
    if: needs.changes.outputs.e2e != 'false'
    runs-on: ubuntu-latest
    # C18: the web suite (signup and reload) in WebKit, against the test host serving the build same-origin, with the native testkit peer.
    # The wasm arrives inside the two builds; no Rust toolchain here.
    # Budget (L-CI-21, ruling of 2026-10-13: one job per Playwright project): max(30, ceil(5 x 3.0) + 10) = 30,
    # from web-1's 3.0 min WebKit allowance (signup and reload only; ruling 22 keeps WebKit to those two specs).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Fetch the wasm32-wasip1 core built by the rust-wasi job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dilla-core-wasi
          path: internal/mlswasi/testdata
      - name: Fetch the testkit binary built by the rust-native job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dilla-testkit
          path: artifacts
      - run: chmod +x artifacts/dilla-testkit
      - name: Fetch the web client built by the web-build job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dilla-web-dist
          path: packages/web/dist
      - name: Fetch the core-worker harness built by the web-build job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dilla-core-harness
          path: packages/client-core/harness-dist
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: npm run test:e2e:web:webkit -w @dilla/e2e
        env:
          DILLA_TESTKIT: ${{ github.workspace }}/artifacts/dilla-testkit
      # upload-artifact v4+ refuses a second artifact of the same name in one run: one name per engine.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: browser-web-results-webkit
          path: e2e/test-results
          if-no-files-found: error

  deny:
    needs: [changes]
    if: needs.changes.outputs.core != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: rustup show active-toolchain
      - run: bash scripts/install-ci-tool.sh cargo-deny
      - run: cargo deny --all-features check advisories bans licenses sources

  go:
    needs: [changes, rust-wasi]
    if: needs.changes.outputs.go != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # rust-wasi (Plan A's CI task) builds and uploads the dilla-core-wasi
    # artifact this job downloads. Without `needs:` GitHub starts the jobs in
    # parallel, download-artifact finds nothing in the run, and the job is red on
    # every push (gap-31 §3.2's reference job carries it). The scenario harness
    # (internal/testkit) is go-harness's: here DILLA_TESTKIT is unset and those
    # tests skip, which keeps this job inside a 4-vCPU runner's budget.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Fetch the wasm32-wasip1 core built by the rust-wasi job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dilla-core-wasi
          path: internal/mlswasi/testdata
      - run: go mod verify
      - run: go vet ./...
      - name: The pinned module graph still compiles cgo-free
        run: CGO_ENABLED=0 go build -tags dillapins ./internal/deps
      # Every package but internal/ds and internal/api, which go-ds and go-api run: together they are
      # ./... (the checker pins all three lines). internal/ds under -race took ~7.5 min of a 4-core machine's ~8 min alone and
      # pushed this job past its 25 minutes on the runner (run 36697379567). The API package
      # alone took ~620 s locally under -race and hit a 20-minute timeout here (run 39486567482), so
      # go-api runs it with a budget of its own.
      - name: Unit tests with the race detector (cgo required, do not set CGO_ENABLED=0 here)
        run: go test -race -shuffle=on -timeout 20m $(go list ./... | grep -vx -e github.com/jonasthim/dilla/internal/ds -e github.com/jonasthim/dilla/internal/api)
        env:
          GORACE: halt_on_error=1
      # I8: these five video publishing tests are gated out of -race due to the pinned LiveKit race.
      # scripts/check-ci-workflow.mjs finds every raceEnabled-gated test and requires it here.
      - name: Video publishing tests without the upstream LiveKit race detector conflict
        run: go test -timeout 5m ./cmd/dilla-loadrig ./cmd/dilla-mediabot ./internal/media ./internal/sfu -run 'TestALoopbackCellDecryptsEverything|TestTwoBotsDecryptEachOtherThroughTheSFU|TestGoPublisherToGoSubscriberDecryptsThroughTheSFU|TestTheSFUOfferCarriesOnlyTheDillaCodecs|TestPromotionAddsTheVideoSourcesAndDemotionRemovesThem'
      - name: Static release build
        run: CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' ./cmd/dillad

  go-ds:
    needs: [changes, rust-wasi]
    if: needs.changes.outputs.go != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The delivery service's tests drive the real wasm core over a 1,500-leaf fixture, and under the
    # race detector they are the slowest package of the module, so they have a job and a budget of
    # their own; the go job runs everything else. Measured on a 4-core machine: 250 s (447 s before
    # the reconcile asked its ACL once per group); the runner is roughly three times slower.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Fetch the wasm32-wasip1 core built by the rust-wasi job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dilla-core-wasi
          path: internal/mlswasi/testdata
      - name: The delivery service's tests with the race detector
        run: go test -race -shuffle=on -timeout 20m ./internal/ds/...
        env:
          GORACE: halt_on_error=1

  go-api:
    needs: [changes, rust-wasi]
    if: needs.changes.outputs.go != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # internal/api under the race detector takes about 620 s on a 4-core machine and ran into a
    # 20-minute package timeout on the runner (run 39486567482), so it has a job and a budget of its
    # own; the go job leaves it out and the checker pins both halves.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Fetch the wasm32-wasip1 core built by the rust-wasi job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dilla-core-wasi
          path: internal/mlswasi/testdata
      - name: The API package's tests with the race detector
        run: go test -race -shuffle=on -timeout 30m ./internal/api/...
        env:
          GORACE: halt_on_error=1

  go-harness:
    needs: [changes, rust-wasi, rust-native]
    if: needs.changes.outputs.go != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The scenario harness drives a real instance with the Rust testkit clients:
    # it needs the wasi core from rust-wasi and the testkit binary from
    # rust-native, and it is the slowest Go suite, so it has a job and a
    # timeout of its own.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Fetch the wasm32-wasip1 core built by the rust-wasi job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dilla-core-wasi
          path: internal/mlswasi/testdata
      - name: Fetch the testkit binary built by the rust-native job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dilla-testkit
          path: artifacts
      - run: chmod +x artifacts/dilla-testkit
      - name: The scenario harness against the real instance
        run: go test -race -shuffle=on -timeout 25m ./internal/testkit/...
        env:
          GORACE: halt_on_error=1
          DILLA_TESTKIT: ${{ github.workspace }}/artifacts/dilla-testkit
          # internal/testkit skips without the binary; here a skip would pass every scenario test
          # without running one, so a missing or unusable binary must fail instead.
          DILLA_TESTKIT_REQUIRED: '1'

  go-fts5-arm64:
    needs: [changes]
    if: needs.changes.outputs.go != 'false'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: FTS5 on native linux/arm64
        run: go test ./internal/store/sqlite/...

  # go-lint, go-vuln and go-sqlc carry no `needs:` on purpose: `go vet ./...` and `go build` exit 0 with
  # the wasi artifact absent and with the committed web placeholder, so they start at t=0. go-release
  # waits for web-build: the release binaries embed the real client, never the placeholder (C9).
  go-lint:
    needs: [changes]
    if: needs.changes.outputs.go != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: bash scripts/install-ci-tool.sh golangci-lint
      - run: golangci-lint run ./...

  go-vuln:
    needs: [changes]
    if: needs.changes.outputs.go != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: The pinned-but-unimported module graph is scanned too
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 -scan package -tags dillapins ./internal/deps

  go-sqlc:
    needs: [changes]
    if: needs.changes.outputs.go != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: bash scripts/install-ci-tool.sh sqlc
      - run: sqlc diff
      - run: git diff --exit-code
      - run: test -z "$(git status --porcelain)"

  go-postgres:
    needs: [changes, rust-wasi]
    if: needs.changes.outputs.go != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.6-alpine3.24      # not "-alpine": that floats onto the next Alpine
        env:
          POSTGRES_PASSWORD: dilla
          POSTGRES_USER: dilla
          POSTGRES_DB: dilla
          POSTGRES_INITDB_ARGS: --locale-provider=builtin --builtin-locale=C.UTF-8
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dilla" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dilla-core-wasi
          path: internal/mlswasi/testdata
      # Only the packages that have a Postgres leg: internal/store (every query, both engines) and
      # internal/ops (the Postgres backup, LoadPostgres, identity reset and heal-rollback tests).
      # internal/api and internal/ds read SQLite only, so listing them here reran the go job's SQLite
      # tests, and internal/ds under -race outran go test's 10m default on this runner; that, not
      # Postgres, is what timed the job out. The -timeout is explicit and inside timeout-minutes.
      - name: The store and ops tests against Postgres
        run: go test -race -shuffle=on -timeout 20m ./internal/store/... ./internal/ops/...
        env:
          DILLA_TEST_PG: postgres://dilla:dilla@127.0.0.1:5432/dilla?sslmode=disable
      # web3.9: the AFK backfill and the channel-parent rules have Postgres legs in internal/api; -run keeps the rest of
      # that package (SQLite only, in the go job) out of this one.
      - name: The AFK and channel-parent tests against Postgres
        run: go test -race -shuffle=on -timeout 20m -run 'AFK|Afk|HiddenCategory|HiddenParent|ParentAnywhere|Marker|ConcurrentEnsures|ReadsThePointer' ./internal/api/...
        env:
          DILLA_TEST_PG: postgres://dilla:dilla@127.0.0.1:5432/dilla?sslmode=disable

  go-release:
    needs: [changes, web-build]
    if: needs.changes.outputs.go != 'false' || needs.changes.outputs.web != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: rm -rf internal/web/dist
      - name: Fetch the web client built by the web-build job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dilla-web-dist
          path: internal/web/dist
      - name: The binaries embed the real client, not the placeholder
        run: |
          test -f internal/web/dist/index.html
          if grep -q 'content="placeholder"' internal/web/dist/index.html; then echo "internal/web/dist still holds the placeholder client"; exit 1; fi
      # Ruling 38: the webdist test reads DILLA_WEB_DIST through os.DirFS, so it proves the downloaded bytes
      # that the build below embeds.
      - name: the downloaded client passes the manifest check
        run: go test -tags webdist ./internal/web/...
        env:
          DILLA_WEB_DIST: ${{ github.workspace }}/internal/web/dist
      - name: linux/amd64
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o dist/dillad-linux-amd64 ./cmd/dillad
      - name: linux/arm64
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags='-s -w' -o dist/dillad-linux-arm64 ./cmd/dillad
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dillad-binaries
          path: dist/
          if-no-files-found: error

  # One check for the whole workflow, so that a required-check list needs only this name: it is red when any job
  # failed or was cancelled (a failed `changes` included) and green when the rest passed or were skipped by design.
  ci-ok:
    needs: [changes, docs, node, ui, rust-wasm-node, rust-native, rust-wasi, vectors, browser-spike, browser-media, web-build, chromium-web, firefox-web, webkit-web, deny, go, go-ds, go-api, go-harness, go-fts5-arm64, go-lint, go-vuln, go-sqlc, go-postgres, go-release]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo ok
