name: release
# A GitHub release for a v* tag: dillad, dillabot, its native helper and the Spotify helper for linux/amd64 and linux/arm64,
# the real web client embedded, the wasm32-wasip1 core, deploy/install.sh, deploy/install-bot.sh
# and SHA256SUMS over all assets. The two installers handle dillad and dillabot independently. No container image is built or pushed here.
#
# Each attached installer has the tag stamped into its release tag variable, so it installs this release by
# default: there is no "latest" (GitHub never serves a prerelease as latest, and every hyphenated tag
# is a prerelease here).
#
# Only a tag on a commit of main is released: main is what ci.yml gates. Workflow actions are
# GitHub-owned and pinned to commits; other tool archives have checked-in SHA-256 pins. No job
# restores a build cache, because the release job publishes what install.sh runs as root.
#
# workflow_dispatch builds the release for an existing tag that has none yet (say, after a failed
# run): choose the tag itself as the ref in "Use workflow from" and type the same tag; the tag job
# refuses a mismatch. A release that already exists is refused; delete it first to rebuild it.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: the existing tag to release, e.g. v0.1.0 (run the workflow from that tag)
        required: true
        type: string
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
      version: ${{ steps.tag.outputs.version }}
      noise_mode: ${{ steps.tag.outputs.noise_mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: The release tag is the ref the workflow runs on, on a commit of main
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG:-$GITHUB_REF_NAME}"
          case "$tag" in
            v[0-9]*) ;;
            *) echo "release tags look like v1.2.3, got: $tag"; exit 1 ;;
          esac
          case "$tag" in
            *[!A-Za-z0-9.+_-]*) echo "the tag holds a character a release tag must not: $tag"; exit 1 ;;
          esac
          test "$GITHUB_REF" = "refs/tags/$tag" || { echo "run the workflow from the tag $tag itself, not from $GITHUB_REF"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$tag points at $GITHUB_SHA, which is not on main; only main, which ci.yml gates, is released"; exit 1; }
          case "$tag" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "noise_mode=$(node scripts/release-noise-mode.mjs "$tag")" >> "$GITHUB_OUTPUT"

  web-build:
    runs-on: ubuntu-24.04
    needs: [tag]
    timeout-minutes: 15
    # The same build as ci.yml's web-build, LLVM 23.1 pin included: the dist is what the binaries embed.
    env:
      CC_wasm32_unknown_unknown: /usr/bin/clang-23
      AR_wasm32_unknown_unknown: /usr/bin/llvm-ar-23
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: clang 23 for the wasm C build
        run: |
          test "$(lsb_release -cs)" = noble
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key -o "$RUNNER_TEMP/llvm-snapshot.asc"
          gpg --dearmor -o "$RUNNER_TEMP/apt-llvm.gpg" "$RUNNER_TEMP/llvm-snapshot.asc"
          primaries=$(gpg --show-keys --with-colons "$RUNNER_TEMP/apt-llvm.gpg" | awk -F: '$1 == "pub" { want = 1; next } $1 == "fpr" && want { print $10; want = 0 }')
          test "$primaries" = 6084F3CF814B57C1CF12EFD515CF4D18AF4F7421
          sudo install -m 0644 "$RUNNER_TEMP/apt-llvm.gpg" /usr/share/keyrings/apt-llvm.gpg
          cmp "$RUNNER_TEMP/apt-llvm.gpg" /usr/share/keyrings/apt-llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/apt-llvm.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-23 main" | sudo tee /etc/apt/sources.list.d/apt-llvm-23.list
          sudo apt-get update
          apt-cache policy clang-23 llvm-23
          v=$(apt-cache policy clang-23 | awk '/Candidate:/ { print $2 }')
          case "$v" in 1:23.1.*~++*) ;; *) echo "expected clang 23.1.x candidate, got $v"; exit 1 ;; esac
          sudo apt-get install -y --no-install-recommends "clang-23=$v" "llvm-23=$v" "libllvm23=$v" "libclang-cpp23=$v" "libclang1-23=$v" "libclang-common-23-dev=$v" "llvm-23-linker-tools=$v" "llvm-23-runtime=$v"
          for p in clang-23 llvm-23 libllvm23 libclang-cpp23 libclang1-23 libclang-common-23-dev llvm-23-linker-tools llvm-23-runtime; do test "$(dpkg-query -W -f='${Version}' "$p")" = "$v"; done
          /usr/bin/clang-23 --version | grep -F "clang version 23.1."
          /usr/bin/clang-23 --version
          /usr/bin/llvm-ar-23 --version
      - run: rustup show active-toolchain
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - run: bash scripts/install-ci-tool.sh wasm-bindgen
      - run: bash scripts/install-ci-tool.sh wasm-pack
      - run: bash scripts/install-ci-tool.sh binaryen
      - run: wasm-pack build core/dilla-core-wasm --target web --profile wasm-release --mode no-install --out-dir ../../packages/core-wasm/pkg
      - run: node scripts/check-wasm-size.mjs packages/core-wasm/pkg/dilla_core_wasm_bg.wasm
      - run: npm ci
      - run: npm run typecheck -w @dilla/core-wasm
      - run: npm run typecheck -w @dilla/client-core
      - run: npm run typecheck -w @dilla/web
      - run: npm run build -w @dilla/web
        env:
          DILLA_NOISE_MODE: ${{ needs.tag.outputs.noise_mode }}
      - run: npm run test:noise-release
      - run: go test -tags webdist ./internal/web/...
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dilla-web-dist
          path: packages/web/dist/
          if-no-files-found: error

  rust-wasi:
    runs-on: ubuntu-latest
    needs: [tag]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: rustup show active-toolchain
      - run: cargo build -p dilla-core-wasi --target wasm32-wasip1 --release --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dilla-core-wasi
          path: target/wasm32-wasip1/release/dilla_core_wasi.wasm
          if-no-files-found: error

  spotify-helper:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    needs: [tag]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: cargo fmt --manifest-path crates/dilla-spotify-helper/Cargo.toml -- --check
      - run: cargo clippy --manifest-path crates/dilla-spotify-helper/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path crates/dilla-spotify-helper/Cargo.toml --locked
      - run: cargo build --manifest-path crates/dilla-spotify-helper/Cargo.toml --release --locked
      - run: mkdir -p dist && install -m 0755 target/release/dilla-spotify-helper dist/dilla-spotify-helper-linux-${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dilla-spotify-helper-${{ matrix.arch }}
          path: dist/dilla-spotify-helper-linux-${{ matrix.arch }}
          if-no-files-found: error

  bot-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    needs: [tag]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - run: rustup show active-toolchain
      - run: cargo fmt --all -- --check
      - run: cargo test -p dilla-bot-core --locked
      - run: cargo build -p dilla-bot-core --release --locked
      - run: go test ./internal/bot/... ./cmd/dillabot
      - name: Build the architecture-matched Bot binary with the release version
        env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} go build -trimpath -ldflags="-s -w -X main.Version=${VERSION}" -o dist/dillabot-linux-${{ matrix.arch }} ./cmd/dillabot
      - name: The Bot binary carries the release version
        env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: test "$(dist/dillabot-linux-${{ matrix.arch }} version)" = "dillabot $VERSION"
      - run: install -m 0755 target/release/dilla-bot-core dist/dilla-bot-core-linux-${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dilla-bot-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  go-release:
    runs-on: ubuntu-latest
    needs: [tag, web-build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - run: rm -rf internal/web/dist
      - name: Fetch the web client built by the web-build job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dilla-web-dist
          path: internal/web/dist
      - name: The binaries embed the real client, not the placeholder
        run: |
          test -f internal/web/dist/index.html
          if grep -q 'content="placeholder"' internal/web/dist/index.html; then echo "internal/web/dist still holds the placeholder client"; exit 1; fi
      - name: the downloaded client passes the manifest check
        run: go test -tags webdist ./internal/web/...
        env:
          DILLA_WEB_DIST: ${{ github.workspace }}/internal/web/dist
      # The tag job's version (the tag, its leading v dropped) is the binary's version (cmd/dillad main.Version);
      # every other build keeps 0.0.0-dev. It reaches the shell only through env, and the tag job allows only
      # [A-Za-z0-9.+_-] in the tag, so it is one word in the flags.
      - name: linux/amd64
        env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w -X main.Version=${VERSION}" -o dist/dillad-linux-amd64 ./cmd/dillad
      - name: linux/arm64
        env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w -X main.Version=${VERSION}" -o dist/dillad-linux-arm64 ./cmd/dillad
      # The amd64 binary runs here and says its version. The arm64 one cannot run here, and -trimpath records no ldflags,
      # so it is built by the same flags (the checker holds both lines) and must hold the version's text.
      - name: The binaries carry the release's version
        env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          test -n "$VERSION"
          test "$(dist/dillad-linux-amd64 version | cut -d' ' -f1-2)" = "dillad $VERSION"
          grep -qaF -- "$VERSION" dist/dillad-linux-arm64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dillad-binaries
          path: dist/
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [tag, go-release, rust-wasi, spotify-helper, bot-release]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Fetch the binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dillad-binaries
          path: release
      - name: Fetch the wasi core
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dilla-core-wasi
          path: release
      - name: Fetch the architecture-matched Spotify helpers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: dilla-spotify-helper-*
          path: release
          merge-multiple: true
      - name: Fetch the architecture-matched Bot services and native helpers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: dilla-bot-*
          path: release
          merge-multiple: true
      - name: Assets and SHA256SUMS
        env:
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          cp deploy/install.sh release/install.sh
          sed -i "s/^DILLA_RELEASE_TAG=\"\"$/DILLA_RELEASE_TAG=\"$TAG\"/" release/install.sh
          test "$(grep -c "^DILLA_RELEASE_TAG=\"$TAG\"$" release/install.sh)" -eq 1
          cp deploy/install-bot.sh release/install-bot.sh
          sed -i "s/^DILLA_BOT_RELEASE_TAG=\"\"$/DILLA_BOT_RELEASE_TAG=\"$TAG\"/" release/install-bot.sh
          test "$(grep -c "^DILLA_BOT_RELEASE_TAG=\"$TAG\"$" release/install-bot.sh)" -eq 1
          cd release
          for f in dillad-linux-amd64 dillad-linux-arm64 dillabot-linux-amd64 dillabot-linux-arm64 dilla-bot-core-linux-amd64 dilla-bot-core-linux-arm64 dilla-spotify-helper-linux-amd64 dilla-spotify-helper-linux-arm64 dilla_core_wasi.wasm install.sh install-bot.sh; do test -s "$f"; done
          test "$(ls | wc -l)" -eq 11
          sha256sum dillad-linux-amd64 dillad-linux-arm64 dillabot-linux-amd64 dillabot-linux-arm64 dilla-bot-core-linux-amd64 dilla-bot-core-linux-arm64 dilla-spotify-helper-linux-amd64 dilla-spotify-helper-linux-arm64 dilla_core_wasi.wasm install.sh install-bot.sh > SHA256SUMS
          sha256sum -c --strict SHA256SUMS
          cat SHA256SUMS
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
          PRERELEASE: ${{ needs.tag.outputs.prerelease }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then echo "release $TAG already exists; delete it first to rebuild it"; exit 1; fi
          flags=""
          if [ "$PRERELEASE" = true ]; then flags="--prerelease"; fi
          notes=(--generate-notes)
          if [ -f "docs/deploy/releases/$TAG.md" ]; then notes=(--notes-file "docs/deploy/releases/$TAG.md"); fi
          gh release create "$TAG" --verify-tag --title "$TAG" "${notes[@]}" $flags \
            release/dillad-linux-amd64 release/dillad-linux-arm64 release/dillabot-linux-amd64 release/dillabot-linux-arm64 release/dilla-bot-core-linux-amd64 release/dilla-bot-core-linux-arm64 release/dilla-spotify-helper-linux-amd64 release/dilla-spotify-helper-linux-arm64 release/dilla_core_wasi.wasm release/install.sh release/install-bot.sh release/SHA256SUMS
